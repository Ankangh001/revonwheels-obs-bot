<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}#panel{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:760px;padding:12px 24px;border:2px solid #ed65ba;border-radius:18px;background:linear-gradient(110deg,rgba(14,9,36,.94),rgba(40,13,52,.92));color:white;text-align:center;box-shadow:0 0 20px #e757a644}.label{font-size:24px;font-weight:900;letter-spacing:3px;color:#ff87cd}.clock{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:2px;margin:3px 0}.note{font-size:15px;color:#9eeae7;letter-spacing:1px}@media(max-width:800px){#panel{width:650px;bottom:28px;padding:18px}.label{font-size:28px}.clock{font-size:46px}.note{font-size:17px}}
</style></head><body><div id="panel"><div class="label">GTA VI RELEASE COUNTDOWN</div><div id="clock" class="clock"></div><div class="note">19 NOV 2026 · 00:00 IST · PS5 / XBOX SERIES X|S</div></div><script>
const target=Date.parse('2026-11-19T00:00:00+05:30');
function tick(){const s=Math.max(0,Math.ceil((target-Date.now())/1000));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;document.getElementById('clock').textContent=s?`${d}D  ${String(h).padStart(2,'0')}H  ${String(m).padStart(2,'0')}M  ${String(sec).padStart(2,'0')}S`:'GTA VI RELEASE DAY';}tick();setInterval(tick,250);
</script></body></html>
